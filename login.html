
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="StayHealthy frontend demo login form. No real account authentication is available."
    >

    <title>StayHealthy | Login</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="navigation.css">
    <script src="login.js" defer></script>
    <script src="navigation.js" defer></script>
</head>

<body>

    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a href="index.html" class="brand">
                <img src="images/doctor-3.webp" alt="" width="42" height="42">
                <span>StayHealthy</span>
            </a>
            <button class="menu-toggle" id="menuToggle" type="button"
                aria-label="Open navigation menu" aria-expanded="false" aria-controls="navLinks">☰</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="appointments.html">Appointments</a></li>
                <li><a href="health-blog.html">Health Blog</a></li>
                <li><a href="reviews.html">Reviews</a></li>
                <li><a href="signup.html" class="signup-link">Sign Up</a></li>
                <li><a href="login.html" class="login-link active" aria-current="page">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="login-container">

        <section class="login-card" aria-labelledby="login-title">

            <h1 id="login-title">Login</h1>

            <p class="signup-text">
                Are you a new member?
                <a href="signup.html">Sign up here</a>
            </p>

            <p class="demo-note">This frontend demo does not authenticate or store accounts.</p>

            <form id="loginForm" method="post">

                <!-- Email Address -->
                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        aria-describedby="message"
                        required
                    >

                </div>

                <!-- Password -->
                <div class="form-group">

                    <label for="password">Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            aria-describedby="message"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            👁
                        </button>

                    </div>

                </div>

                <!-- Login Button -->
                <button type="submit" class="login-btn">
                    Login
                </button>

                <!-- Reset Button -->
                <button type="reset" class="reset-btn">
                    Reset
                </button>

                <!-- Forgot Password -->
                <p class="forgot-password">
                    <a href="forgot-password.html">
                        Forgot password?
                    </a>
                </p>

                <!-- Status Message -->
                <p
                    id="message"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true"
                ></p>

            </form>

        </section>

    </main>

</body>
</html>
