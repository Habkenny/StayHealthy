<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Password recovery page for StayHealthy demo.">
    <title>StayHealthy | Password Recovery</title>
    <style>
        :root {
            --primary: #10685f;
            --primary-dark: #0b514b;
            --background: #f0f7f6;
            --text: #243b3a;
            --muted: #536966;
            --border: #dce8e5;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #e9f5f2, #f7faf9);
            color: var(--text);
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        .card {
            width: min(520px, 100%);
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(30, 85, 76, 0.09);
            padding: 38px 32px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 2.5rem);
            text-align: center;
        }

        p {
            margin: 0 0 22px;
            color: var(--muted);
            line-height: 1.7;
            text-align: center;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .primary {
            background: var(--primary);
            color: var(--white);
        }

        .secondary {
            background: #edf4f2;
            color: var(--text);
        }

        .card {
            margin: auto;
        }

        @media (max-width: 520px) {
            .card {
                margin: 35px auto;
                padding: 30px 22px;
            }
        }
    </style>
    <link rel="stylesheet" href="navigation.css">
    <script src="navigation.js" defer></script>
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a href="index.html" class="brand">
                <img src="images/doctor-3.webp" alt="" width="42" height="42">
                <span>StayHealthy</span>
            </a>
            <button class="menu-toggle" id="menuToggle" type="button"
                aria-label="Open navigation menu" aria-expanded="false" aria-controls="navLinks">☰</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="appointments.html">Appointments</a></li>
                <li><a href="health-blog.html">Health Blog</a></li>
                <li><a href="reviews.html">Reviews</a></li>
                <li><a href="signup.html" class="signup-link">Sign Up</a></li>
                <li><a href="login.html" class="login-link">Login</a></li>
            </ul>
        </nav>
    </header>
    <main class="card">
        <h1>Password recovery</h1>
        <p>This is a frontend-only demo. A real password reset flow requires a secure backend and account recovery workflow.</p>

        <div class="actions">
            <a href="login.html" class="button primary">Back to login</a>
            <a href="signup.html" class="button secondary">Create a new account</a>
        </div>
    </main>
</body>
</html>
