<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Password recovery page for StayHealthy demo.">
    <title>StayHealthy | Password Recovery</title>
    <style>
        :root {
            --primary: #168477;
            --primary-dark: #10685f;
            --background: #f0f7f6;
            --text: #243b3a;
            --muted: #71817f;
            --border: #dce8e5;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #e9f5f2, #f7faf9);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: min(520px, 100%);
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(30, 85, 76, 0.09);
            padding: 38px 32px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 2.5rem);
            text-align: center;
        }

        p {
            margin: 0 0 22px;
            color: var(--muted);
            line-height: 1.7;
            text-align: center;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .primary {
            background: var(--primary);
            color: var(--white);
        }

        .secondary {
            background: #edf4f2;
            color: var(--text);
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Password recovery</h1>
        <p>This is a frontend-only demo. A real password reset flow requires a secure backend and account recovery workflow.</p>

        <div class="actions">
            <a href="login.html" class="button primary">Back to login</a>
            <a href="signup.html" class="button secondary">Create a new account</a>
        </div>
    </main>
</body>
</html>
